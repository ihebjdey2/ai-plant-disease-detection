name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-secret-key
  DATABASE_URL: sqlite:///ci.db
  FLASK_ENV: development

jobs:
  test:
    name: Test and validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Run automated tests
        run: pytest

      - name: Upgrade disposable database
        run: flask --app run.py db upgrade

      - name: Show current migration
        run: flask --app run.py db current

      - name: Check for missing migrations
        run: flask --app run.py db check
