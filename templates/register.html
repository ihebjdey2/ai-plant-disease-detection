<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · AgriDiagnose AI</title><link rel="stylesheet" href="{{url_for('static',filename='css/auth.css')}}"></head><body><main class="auth-card"><h1>AgriDiagnose AI</h1><p>Create your account</p>{% for c,m in get_flashed_messages(with_categories=true) %}<p>{{m}}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" minlength="8" placeholder="Password (8+ characters)" required><button>Create account</button></form><p><a href="{{url_for('auth.login')}}">Login</a></p></main></body></html>
