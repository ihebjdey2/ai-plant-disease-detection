<form class="language-switcher" aria-label="{{ t('Language') }}">
  <label for="language-select">{{ t('Language') }}</label>
  <select id="language-select" onchange="if(this.value) window.location.href=this.value">
    {% for code, name in supported_languages.items() %}
      <option value="{{ url_for('set_language', language=code, next=request.full_path) }}"{% if code == current_language %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
</form>
