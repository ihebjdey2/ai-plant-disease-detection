<nav class="language-switcher" aria-label="{{ t('Language') }}">
  {% for code, name in supported_languages.items() %}
    <a href="{{ url_for('set_language', language=code, next=request.full_path) }}" lang="{{ code }}" dir="{{ 'rtl' if code == 'ar' else 'ltr' }}"{% if code == current_language %} aria-current="true"{% endif %}>{{ code|upper }}</a>
  {% endfor %}
</nav>
